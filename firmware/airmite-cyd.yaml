# ---------------------------------------------------------------- logic

script:
  # Backlight: one place decides the brightness, because three things want a
  # say - whether the screen is idle, whether we are inside the night window,
  # and which night mode is selected. A touch always wins for 2 min.
  - id: apply_backlight
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (!id(is_idle))
                return false;
              auto t = id(ha_time).now();
              if (!t.is_valid())
                return false;              // no clock yet: behave as daytime
              return time_in_window(t.hour * 60 + t.minute,
                                    id(night_from).hour * 60 + id(night_from).minute,
                                    id(night_to).hour * 60 + id(night_to).minute)
                     && id(night_mode).current_option() == "Off";
          then:
            - light.turn_off: backlight
          else:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  // Full brightness whenever the night window is not dimming or
                  // switching the screen off. There is no LDR on this board to
                  // read the room with, and a permanently dimmed living-room
                  // display is just hard to read from the sofa.
                  if (!id(is_idle))
                    return 1.0f;           // in use
                  auto t = id(ha_time).now();
                  bool night = t.is_valid() &&
                      time_in_window(t.hour * 60 + t.minute,
                                     id(night_from).hour * 60 + id(night_from).minute,
                                     id(night_to).hour * 60 + id(night_to).minute);
                  if (night && id(night_mode).current_option() == "Dim")
                    return 0.03f;          // just readable in the dark
                  return id(idle_bright).state / 100.0f;

  # A short tap does nothing but explain itself. Without this the device just
  # looks broken to anyone who does not already know it wants a long press.
  - id: hint
    mode: restart
    parameters:
      target: int
    then:
      - if:
          condition:
            lambda: 'return target == 0;'
          then:
            - lvgl.label.update:
                id: lbl_heat
                text: !lambda 'return std::string("HOLD TO SET");'
                text_font: f_air
                text_color: 0xF2F4F7
          else:
            - lvgl.label.update:
                id: lbl_cool
                text: !lambda 'return std::string("HOLD TO SET");'
                text_font: f_air
                text_color: 0xF2F4F7
      - delay: 1.5s
      - script.execute: refresh

  # An active scan takes about two seconds; 4 s of slack costs nothing and the
  # UI keeps running through the delay. mode: restart so impatient taps do not
  # stack up scans.
  - id: ssid_scan
    mode: restart
    then:
      - lambda: |-
          id(dd_ssid)->set_options({"SCANNING..."});
          wifi_scan_begin();
      - lvgl.widget.show: dd_ssid
      - delay: 4s
      - lambda: |-
          id(dd_ssid)->set_options(
              wifi_scan_options("TYPE IT BY HAND"));
          lv_dropdown_open(id(dd_ssid)->obj);

  - id: set_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid())
              return std::string("--:--");
            char buf[6];
            t.strftime(buf, sizeof(buf), "%H:%M");
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_big_clock
          text: !lambda 'return std::string(lv_label_get_text(id(lbl_clock)));'
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid())
              return std::string("");
            static const char *d_en[] = {"SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"};
            static const char *m_en[] = {"JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY",
                                         "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"};
            return str_sprintf("%s, %s %d", d_en[t.day_of_week - 1], m_en[t.month - 1], t.day_of_month);

  # Repaint the main page from the chosen palette, then let refresh() redo the
  # value-dependent colours (CO2 and the air message) with the same palette.
  # Only the main page is themed: the settings pages keep one dark chrome so the
  # controls do not change appearance while you are operating them.
  # Forced recalibration to 420 ppm (outdoor air). Clears the manual CO2 trim:
  # after this the sensor itself is right.
  - id: co2_cal
    mode: single
    then:
      - scd4x.perform_forced_calibration:
          id: scd
          value: 420
      # ESPHome only sets the FRC in the sensor's RAM: a power cut loses it (seen 2026-10-29: 409 -> 462 ppm
      # outdoors after a replug). persist_settings (0x3615) writes it to the SCD41's EEPROM; it needs
      # periodic measurement stopped, so: stop, persist, restart in low-power periodic (the mode set above).
      - lambda: 'static const uint8_t c[2] = {0x3f, 0x86}; id(cn1_bus)->write(0x62, c, 2);'  # stop
      - delay: 600ms
      - lambda: 'static const uint8_t c[2] = {0x36, 0x15}; id(cn1_bus)->write(0x62, c, 2);'  # persist
      - delay: 900ms
      - lambda: 'static const uint8_t c[2] = {0x21, 0xac}; id(cn1_bus)->write(0x62, c, 2);'  # low-power periodic
      - number.set:
          id: co2_offset
          value: 0
      - lvgl.label.update:
          id: lbl_co2_cal
          text: !lambda 'return std::string("CO2 SET TO 420");'
      - delay: 4s
      - script.execute: refresh

  - id: apply_skin
    mode: restart
    then:
      - lvgl.widget.update:
          id: main_page
          bg_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).top);'
          bg_grad_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).bg);'
      - lvgl.widget.update:
          id: clock_page
          bg_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).top);'
          bg_grad_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).bg);'
      - lvgl.label.update:
          id: lbl_big_clock
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).temp);'
      - lvgl.label.update:
          id: lbl_date
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).dim);'
      - lvgl.widget.update:
          id: [card_l, card_r]
          bg_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).card);'
          border_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).card_line);'
      - lvgl.label.update:
          id: lbl_temp
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).temp);'
      - lvgl.label.update:
          id: lbl_hum
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).hum);'
      - lvgl.label.update:
          id: lbl_clock
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).fg);'
      - lvgl.label.update:
          id: lbl_u_c
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).dim);'
      - lvgl.label.update:
          id: lbl_u_hr
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).dim);'
      - lvgl.label.update:
          id: lbl_u_co2
          text_color: !lambda 'return lv_color_hex(cyd_skin(id(skin)).dim);'
      - script.execute: refresh

  - id: refresh
    mode: restart
    then:
      - script.execute: set_clock
      - lvgl.label.update:
          id: lbl_temp
          text: !lambda |-
            if (!id(temp).has_state()) return std::string("--.-");
            return str_sprintf("%.1f", id(temp).state);
      - lvgl.label.update:
          id: lbl_hum
          text: !lambda |-
            if (!id(hum).has_state()) return std::string("--");
            return str_sprintf("%.0f%%", id(hum).state);

      # CO2: the number and the word below it change colour together.
      - lvgl.label.update:
          id: lbl_co2
          text: !lambda |-
            if (!id(co2).has_state()) return std::string("----");
            return str_sprintf("%.0f", id(co2).state);
          text_color: !lambda |-
            const CydSkin &s = cyd_skin(id(skin));
            if (!id(co2).has_state()) return lv_color_hex(s.dim);
            if (id(co2).state < ${co2_good})  return lv_color_hex(s.co2_good);
            if (id(co2).state < ${co2_bad}) return lv_color_hex(s.co2_warn);
            return lv_color_hex(s.co2_bad);
      - lvgl.label.update:
          id: lbl_air
          text: !lambda |-
            if (!id(co2).has_state()) return std::string("");
            if (id(co2).state < ${co2_good})  return std::string("AIR GOOD");
            if (id(co2).state < ${co2_bad}) return std::string("AIR STALE");
            return std::string("OPEN WINDOW");
          text_color: !lambda |-
            const CydSkin &s = cyd_skin(id(skin));
            if (!id(co2).has_state()) return lv_color_hex(s.dim);
            if (id(co2).state < ${co2_good})  return lv_color_hex(s.co2_good);
            if (id(co2).state < ${co2_bad}) return lv_color_hex(s.co2_warn);
            return lv_color_hex(s.co2_bad);

      # HEAT button: lit = filled orange, ON/OFF underneath.
      - lvgl.widget.update:
          id: btn_heat
          bg_grad_dir: HOR
          bg_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            return lv_color_hex(is_on(id(heat_state).state) ? l.heat.bg : l.btn);
          bg_grad_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            return lv_color_hex(is_on(id(heat_state).state) ? l.heat.bg2 : l.btn);
          border_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            return lv_color_hex(is_on(id(heat_state).state) ? l.heat.line : l.btn_line);
          shadow_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).heat.line);'
          shadow_opa: 45%
          shadow_width: !lambda |-
            return is_on(id(heat_state).state) ? cyd_look(id(skin)).glow : 0;
      - lvgl.widget.update:
          id: bar_heat
          bg_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            if (!(is_on(id(heat_state).state))) return lv_color_hex(l.btn);   // off: no bar, only a lit tile has one
            return lv_color_hex(l.glow == 0 ? l.heat.bg : l.heat.line);
          shadow_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).heat.line);'
          shadow_opa: 80%
          shadow_width: !lambda |-
            return is_on(id(heat_state).state) ? cyd_look(id(skin)).glow / 2 : 0;
      - lvgl.label.update:
          id: lbl_heat
          text: !lambda |-
            if (id(heat_state).state.empty()) return std::string("n/a");
            return is_on(id(heat_state).state) ? std::string("ON")
                                                 : std::string("OFF");
          text_font: f_state        # undo the hint's smaller font
          text_color: !lambda |-
            return is_on(id(heat_state).state) ? lv_color_hex(cyd_look(id(skin)).heat.text)
                                                 : lv_color_hex(cyd_skin(id(skin)).dim);

      # AC button: stays dark with "n/d" until the entity exists.
      - lvgl.widget.update:
          id: btn_cool
          bg_grad_dir: HOR
          bg_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            return lv_color_hex(is_on(id(cool_state).state) ? l.cool.bg : l.btn);
          bg_grad_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            return lv_color_hex(is_on(id(cool_state).state) ? l.cool.bg2 : l.btn);
          border_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            return lv_color_hex(is_on(id(cool_state).state) ? l.cool.line : l.btn_line);
          shadow_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).cool.line);'
          shadow_opa: 45%
          shadow_width: !lambda |-
            return is_on(id(cool_state).state) ? cyd_look(id(skin)).glow : 0;
      - lvgl.widget.update:
          id: bar_cool
          bg_color: !lambda |-
            const CydLook l = cyd_look(id(skin));
            if (!(is_on(id(cool_state).state))) return lv_color_hex(l.btn);   // off: no bar, only a lit tile has one
            return lv_color_hex(l.glow == 0 ? l.cool.bg : l.cool.line);
          shadow_color: !lambda 'return lv_color_hex(cyd_look(id(skin)).cool.line);'
          shadow_opa: 80%
          shadow_width: !lambda |-
            return is_on(id(cool_state).state) ? cyd_look(id(skin)).glow / 2 : 0;
      - lvgl.label.update:
          id: lbl_cool
          text: !lambda |-
            if (id(cool_state).state.empty()) return std::string("n/a");
            return is_on(id(cool_state).state) ? std::string("ON")
                                              : std::string("OFF");
          text_font: f_state
          text_color: !lambda |-
            return is_on(id(cool_state).state) ? lv_color_hex(cyd_look(id(skin)).cool.text)
                                              : lv_color_hex(cyd_skin(id(skin)).dim);

      - lvgl.widget.update:
          id: ico_ha
          image_recolor: !lambda |-
            return id(ha_link).state ? lv_color_hex(0x38BDF8)   // light blue: connected
                                     : lv_color_hex(0x8B98A5);  // grey: disconnected

      # ---- fixed captions
      - lvgl.label.update:
          id: lbl_ttl_heat
          text: !lambda 'return std::string("HEAT");'
      - lvgl.label.update:
          id: lbl_ttl_cool
          text: !lambda 'return std::string("COOL");'
      - lvgl.label.update:
          id: lbl_set_title
          text: !lambda 'return std::string("SETTINGS");'
      - lvgl.label.update:
          id: lbl_cap_pass
          text: !lambda 'return std::string("PASSWORD");'
      - lvgl.label.update:
          id: lbl_save
          text: !lambda 'return std::string("SAVE");'
      - lvgl.textarea.update:
          id: ta_ssid
          placeholder_text: !lambda 'return std::string("wifi network");'
      # ---- calibration page
      - lvgl.label.update:
          id: lbl_cal_title
          text: !lambda 'return std::string("CALIBRATION");'
      - lvgl.label.update:
          id: lbl_co2_cal
          text: !lambda 'return std::string("HOLD: CO2 = 420 OUTDOORS");'
      - lvgl.label.update:
          id: lbl_cap_skin
          text: !lambda 'return std::string("SKIN");'
      - lvgl.label.update:
          id: lbl_skin
          text: !lambda |-
            switch (id(skin)) {
              case 1:  return std::string("NIGHT");
              case 2:  return std::string("DAY");
              case 3:  return std::string("COLOUR");
              case 4:  return std::string("WARM NIGHT");
              case 5:  return std::string("NOPATTERN");
              default: return std::string("CONTRAST");
            }
      - lvgl.label.update:
          id: lbl_temp_offset
          text: !lambda 'return str_sprintf("%+.1f", id(temp_offset).state);'
      - lvgl.label.update:
          id: lbl_hum_offset
          text: !lambda 'return str_sprintf("%+.1f", id(hum_offset).state);'
      - lvgl.label.update:
          id: lbl_co2_offset
          text: !lambda 'return str_sprintf("%+.0f", id(co2_offset).state);'

      # ---- screen page
      - lvgl.label.update:
          id: lbl_night_title
          text: !lambda 'return std::string("SCREEN");'
      - lvgl.label.update:
          id: lbl_cap_mode
          text: !lambda 'return std::string("AT NIGHT");'
      - lvgl.label.update:
          id: lbl_cap_bright
          text: !lambda 'return std::string("BRIGHTNESS");'
      - lvgl.label.update:
          id: lbl_bright
          text: !lambda 'return str_sprintf("%.0f%%", id(idle_bright).state);'
      - lvgl.label.update:
          id: lbl_cap_from
          text: !lambda 'return std::string("FROM");'
      - lvgl.label.update:
          id: lbl_cap_to
          text: !lambda 'return std::string("TO");'
      - lvgl.label.update:
          id: lbl_night_mode
          text: !lambda |-
            auto m = id(night_mode).current_option();
            if (m == "Off") return std::string("OFF");
            if (m == "Dim") return std::string("DIMMED");
            return std::string("ALWAYS ON");
      - lvgl.label.update:
          id: lbl_night_from
          text: !lambda 'return str_sprintf("%02d:%02d", id(night_from).hour, id(night_from).minute);'
      - lvgl.label.update:
          id: lbl_night_to
          text: !lambda 'return str_sprintf("%02d:%02d", id(night_to).hour, id(night_to).minute);'
      - lvgl.label.update:
          id: lbl_cap_flip
          text: !lambda 'return std::string("ROTATION");'
      - lvgl.label.update:
          id: lbl_flip
          text: !lambda |-
            return id(flip_screen).state ? std::string("FLIPPED")
                                         : std::string("NORMAL");

      # ---- alerts page
      - lvgl.label.update:
          id: lbl_alert_title
          text: !lambda 'return std::string("ALERTS");'
      - lvgl.label.update:
          id: lbl_cap_at
          text: !lambda 'return std::string("ALERT BELOW / ABOVE");'
      - lvgl.label.update:
          id: lbl_alert_temp_min
          text: !lambda 'return str_sprintf("%.1f", id(alert_temp_min).state);'
      - lvgl.label.update:
          id: lbl_alert_hum_max
          text: !lambda 'return str_sprintf("%.0f", id(alert_hum_max).state);'
      - lvgl.label.update:
          id: lbl_alert_co2_max
          text: !lambda 'return str_sprintf("%.0f", id(alert_co2_max).state);'
      # ---- tab bars (one copy per settings page)
      - lvgl.label.update:
          id: lbl_tab_cal_1
          text: !lambda 'return std::string("CALIB.");'
      - lvgl.label.update:
          id: lbl_tab_night_1
          text: !lambda 'return std::string("SCREEN");'
      - lvgl.label.update:
          id: lbl_tab_alert_1
          text: !lambda 'return std::string("ALERTS");'
      - lvgl.label.update:
          id: lbl_tab_cal_2
          text: !lambda 'return std::string("CALIB.");'
      - lvgl.label.update:
          id: lbl_tab_night_2
          text: !lambda 'return std::string("SCREEN");'
      - lvgl.label.update:
          id: lbl_tab_alert_2
          text: !lambda 'return std::string("ALERTS");'
      - lvgl.label.update:
          id: lbl_tab_cal_3
          text: !lambda 'return std::string("CALIB.");'
      - lvgl.label.update:
          id: lbl_tab_night_3
          text: !lambda 'return std::string("SCREEN");'
      - lvgl.label.update:
          id: lbl_tab_alert_3
          text: !lambda 'return std::string("ALERTS");'
      - lvgl.label.update:
          id: lbl_tab_cal_4
          text: !lambda 'return std::string("CALIB.");'
      - lvgl.label.update:
          id: lbl_tab_night_4
          text: !lambda 'return std::string("SCREEN");'
      - lvgl.label.update:
          id: lbl_tab_alert_4
          text: !lambda 'return std::string("ALERTS");'
